apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: app-worker
    spec:
      terminationGracePeriodSeconds: 75
      containers:
        - name: worker
          image: YOUR_WORKER_IMAGE:YOUR_TAG
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
